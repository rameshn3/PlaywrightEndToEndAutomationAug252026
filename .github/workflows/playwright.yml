name: Playwright Framework

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:

  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx playwright install --with-deps

      - run: npm install -g allure-commandline

      - name: Clean UI Reports
        run: |
          rm -rf allure-results
          rm -rf allure-report-ui

      - name: Run UI Tests
        run: npm run test:ui

      - name: Generate UI Allure Report
        if: always()
        run: allure generate allure-results --clean -o allure-report-ui

      - name: Upload UI Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-allure-report
          path: allure-report-ui

  api-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx playwright install --with-deps

      - run: npm install -g allure-commandline

      - name: Clean API Reports
        run: |
          rm -rf allure-results
          rm -rf allure-report-api

      - name: Run API Tests
        run: npm run test:api

      - name: Generate API Allure Report
        if: always()
        run: allure generate allure-results --clean -o allure-report-api

      - name: Upload API Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-report
          path: allure-report-api

  heroku-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx playwright install --with-deps

      - run: npm install -g allure-commandline

      - name: Clean Heroku Reports
        run: |
          rm -rf allure-results
          rm -rf allure-report-heroku

      - name: Run Heroku Tests
        run: npm run test:heroku

      - name: Generate Heroku Allure Report
        if: always()
        run: allure generate allure-results --clean -o allure-report-heroku

      - name: Upload Heroku Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heroku-allure-report
          path: allure-report-heroku

  deploy-pages:

    name: Deploy Allure Reports to GitHub Pages

    needs:
      - ui-tests
      - api-tests
      - heroku-tests

    if: always()

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download UI Report
        uses: actions/download-artifact@v4
        with:
          name: ui-allure-report
          path: public/ui

      - name: Download API Report
        uses: actions/download-artifact@v4
        with:
          name: api-allure-report
          path: public/api

      - name: Download Heroku Report
        uses: actions/download-artifact@v4
        with:
          name: heroku-allure-report
          path: public/heroku

      - name: Create Home Page
        run: |
          cat > public/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
              <title>Playwright Allure Reports</title>
              <style>
                  body {
                      font-family: Arial, sans-serif;
                      margin:40px;
                      background:#f5f5f5;
                  }
                  h1 {
                      color:#1565c0;
                  }
                  ul{
                      line-height:2.2;
                  }
                  a{
                      font-size:20px;
                      text-decoration:none;
                  }
              </style>
          </head>
          <body>
              <h1>Playwright Automation Reports</h1>
              <ul>
                  <li><a href="./ui/">UI Automation Report</a></li>
                  <li><a href="./api/">API Automation Report</a></li>
                  <li><a href="./heroku/">Heroku Automation Report</a></li>
              </ul>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public